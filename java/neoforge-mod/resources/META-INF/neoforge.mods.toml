[[mods]]
modId = "mcgen"
version = "0.2.0"
displayName = "mcgen — Rust WorldGen Engine"
authors = "martintondel02"
description = '''
Loads a Rust implementation of Minecraft's world-generation density layer into the
server JVM and exposes it as the /mcgen command tree.

The engine reproduces vanilla's noise, seeding, density functions and chunked
interpolation bit for bit — verified against the real Minecraft classes at
1,591,911 values. It does NOT currently replace chunk generation, and it is
currently slower than vanilla's own code; see the project README before expecting
a speedup.

Commands: /mcgen status | noises | density <x> <y> <z> | verify | bench [chunks] |
chunk <cx> <cz>
'''
