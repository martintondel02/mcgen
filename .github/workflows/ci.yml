name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast: does the Rust compile cleanly, is it formatted, do the unit tests pass.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --release

  # Slow, and the one that actually matters. Downloads the real NeoForge server,
  # compiles the oracle against the real Minecraft jar, and demands that every
  # value match bit for bit. A tolerance would make this job meaningless.
  parity:
    name: Parity against real Minecraft
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch JDK 21
        run: ./scripts/fetch-jdk.sh
      - name: Install NeoForge and build the mod
        run: ./scripts/setup-server.sh
      - name: Check parity
        run: ./scripts/check-parity.sh

  # Proves the mod actually loads and its commands actually run inside a server.
  # This is the job that would have caught a wrong NeoForge stub.
  in-server:
    name: Live server commands
    runs-on: ubuntu-latest
    needs: parity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch JDK 21
        run: ./scripts/fetch-jdk.sh
      - name: Install NeoForge, build and stage the mod
        run: |
          export MCGEN_FRESH_WORLD=1
          ./scripts/setup-server.sh
      - name: Drive the /mcgen commands
        run: ./scripts/test-commands.sh 0 0
